services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: agentlens
      POSTGRES_USER: agentlens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentlens}
    ports:
      - "5432:5432"
    volumes:
      # postgres 18+ images keep PGDATA in a subdirectory of /var/lib/postgresql,
      # so the volume mounts there directly (allows pg_upgrade across majors)
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentlens -d agentlens"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
